codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        # Don't block PRs on coverage decreases during early adoption
        informational: true
    patch:
      default:
        target: 60%
        threshold: 5%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "src/**/*.d.ts"
  - "src/**/*.test.ts"
  - "src/**/*.spec.ts"
  - "**/*.config.*"
  - "scripts/**"
  - "public/**"
  - "lighthouse-reports/**"
