name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      MONGO_URI: mongodb://localhost:27017/test
      SECRET: ci-test-secret
      JWT_SECRET: ci-test-jwt-secret
      NEXT_PUBLIC_API_BASE: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      COINGECKO_BASE: https://api.coingecko.com/api/v3
      OPENSEA_API_KEY: ci-dummy-opensea-key
      API_KEY: ci-dummy-api-key
      CRYPTOCOMPARE: ci-dummy-cryptocompare-key
      NEXT_PUBLIC_CRYPTOCOMPARE: ci-dummy-cryptocompare-key
      SESSION_SECRET: ci-test-session-secret
      REDDIT_CLIENT_ID: ci-dummy-reddit-id
      REDDIT_CLIENT_SECRET: ci-dummy-reddit-secret
      REDDIT_USERNAME: ci-dummy
      REDDIT_PASSWORD: ci-dummy
      USER_AGENT: CI/1.0
      GEMINI_API_KEY: ci-dummy-gemini-key
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
