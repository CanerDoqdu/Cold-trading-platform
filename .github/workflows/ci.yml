name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  # Dummy env vars so build doesn't crash on missing required config
  MONGO_URI: 'mongodb://localhost:27017/test'
  SECRET: 'ci-test-secret-key-not-for-production'
  NEXT_PUBLIC_BASE_URL: 'http://localhost:3000'

jobs:
  # ─── Lint ───
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npx eslint . --max-warnings 50

  # ─── Type Check ───
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit

  # ─── Build ───
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Check bundle size
        run: |
          echo "=== Build Output Size ==="
          du -sh .next/ || true
          echo "=== Static Pages ==="
          find .next/server -name '*.html' | head -20 || true
