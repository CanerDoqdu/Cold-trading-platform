name: Auto PR Description

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and upsert PR description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const invalidTitlePrefix = /^(\s*\[?pr\s*[-_]?\s*\d+\]?\s*[:\-]?\s*)/i;
            if (invalidTitlePrefix.test(pr.title || '')) {
              core.setFailed('PR title must not use numbered prefixes like PR-2 / PR 2. Use an outcome-based title.');
              return;
            }

            // Don't overwrite a manually written description
            if (pr.body && !pr.body.startsWith('<!-- auto-generated -->')) {
              core.info('PR has a manual description — skipping auto-generation.');
              return;
            }

            const { execSync } = require('child_process');

            let commits = '';
            let files = '';
            try {
              commits = execSync(
                'git log origin/main..HEAD --pretty=format:"- %s (%h)"'
              ).toString().trim();
            } catch {
              commits = '- (unable to read commits)';
            }
            try {
              const rawFiles = execSync(
                'git diff --name-only origin/main...HEAD'
              ).toString().trim();
              files = rawFiles
                ? rawFiles.split('\n').map(f => `  - \`${f}\``).join('\n')
                : '  - (no file changes detected)';
            } catch {
              files = '  - (unable to read changed files)';
            }

            const body = [
              '<!-- auto-generated -->',
              '## Context',
              '- Problem statement: _fill in_',
              '- Why now: _fill in_',
              '',
              '## Changes',
              commits || '- (no commits yet)',
              '',
              '## Files Affected',
              files,
              '',
              '## Validation',
              '- [ ] `npm run typecheck` passes',
              '- [ ] `npm run lint` passes',
              '- [ ] `npm run build` passes',
              '- [ ] No secrets committed',
              '',
              '## Risk',
              '- Risk level: Low / Medium / High',
              '- Rollback plan: _fill in_',
            ].join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body,
            });

            core.info('PR description auto-generated successfully.');
